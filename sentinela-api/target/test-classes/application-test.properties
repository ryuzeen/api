# Banco H2 em memoria, isolado, so para a suite de testes (Parte 3).
spring.datasource.url=jdbc:h2:mem:sentinela_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# O H2 cria o schema a partir das entidades JPA a cada execucao.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
