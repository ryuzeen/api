# Perfil DEV: roda a API contra H2 em memoria, sem precisar de Oracle instalado.
# Use apenas para testes locais. A entrega final usa Oracle (application.properties).
spring.datasource.url=jdbc:h2:mem:sentinela_dev;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
# Console do H2 em: http://localhost:8080/h2-console (jdbc url: jdbc:h2:mem:sentinela_dev)
spring.h2.console.enabled=true
