spring.application.name=sentinela-api

# ---- Banco Oracle (Parte 1) ----
# Ajuste host/porta/servico e credenciais conforme o ambiente da turma (ex: Oracle FIAP).
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/XEPDB1
spring.datasource.username=SENTINELA
spring.datasource.password=sentinela
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# As tabelas ja foram criadas pelo script modelo_banco_sentinela.sql.
# 'validate' confere o mapeamento sem alterar o schema. Use 'none' se preferir.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger UI em: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
